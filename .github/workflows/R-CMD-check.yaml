name: R package and BLUPF90 validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::covr, any::remotes
          needs: check
      - name: Install tested sommer
        shell: Rscript {0}
        run: remotes::install_version("sommer", version="4.4.87", upgrade="never")
      - name: Install native Linux backend
        shell: bash
        run: |
          R CMD INSTALL .
          Rscript -e 'library(geneticAnalysisR); info <- install_blupf90(directory=file.path(getwd(),".blupf90","bin")); cat(paste0("BLUPF90_PLUS=",info$executable,"\n"),file=Sys.getenv("GITHUB_ENV"),append=TRUE)'
      - uses: r-lib/actions/check-r-package@v2
      - name: Check coverage
        shell: Rscript {0}
        run: |
          coverage <- covr::package_coverage()
          print(coverage)
          stopifnot(covr::percent_coverage(coverage) >= 80)
