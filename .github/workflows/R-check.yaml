name: R package validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
      - name: Install package and native solver
        shell: Rscript {0}
        run: |
          system2(file.path(R.home("bin"), "R"), c("CMD", "INSTALL", "."))
          library(geneticAnalysisR)
          info <- install_blupf90(directory=file.path(getwd(), ".blupf90", "bin"))
          cat(paste0("BLUPF90_PLUS=", info$executable, "\n"), file=Sys.getenv("GITHUB_ENV"), append=TRUE)
      - name: Native tests and coverage
        shell: Rscript {0}
        run: |
          testthat::test_local()
          coverage <- covr::package_coverage()
          print(coverage)
          stopifnot(covr::percent_coverage(coverage) >= 80)
